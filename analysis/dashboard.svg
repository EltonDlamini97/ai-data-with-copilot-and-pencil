<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800' viewBox='0 0 1200 800'>
  <style>text{font-family:Arial,Helvetica,sans-serif;} .tile{fill:#ffffff;stroke:#222;stroke-width:2;}</style>
  <rect x='20' y='20' width='1160' height='760' fill='#f4f7fb' />
  <text x='40' y='60' font-size='24' font-weight='bold'>Student Placement Dashboard - Summary</text>
  <!-- Metrics -->
  <rect x='40' y='80' width='260' height='110' class='tile' fill='#d0e7ff'/>
  <text x='160' y='120' font-size='16' text-anchor='middle'>Placement Rate</text>
  <text x='160' y='145' id='placement-rate' font-size='20' font-weight='bold' text-anchor='middle'>--</text>

  <rect x='320' y='80' width='260' height='110' class='tile' fill='#e6ffed'/>
  <text x='450' y='120' font-size='16' text-anchor='middle'>Average CGPA</text>
  <text x='450' y='145' id='avg-cgpa' font-size='20' font-weight='bold' text-anchor='middle'>--</text>

  <rect x='600' y='80' width='260' height='110' class='tile' fill='#fff5e6'/>
  <text x='730' y='120' font-size='16' text-anchor='middle'>Avg Salary (Placed)</text>
  <text x='730' y='145' id='avg-salary' font-size='20' font-weight='bold' text-anchor='middle'>--</text>

  <!-- Charts placeholders -->
  <rect x='40' y='210' width='560' height='350' class='tile' />
  <text x='320' y='235' font-size='14' text-anchor='middle'>Placement Rate by Degree</text>
  <image x='80' y='250' width='500' height='300' href='placement_rate_by_degree.png' />

  <rect x='620' y='210' width='540' height='350' class='tile' />
  <text x='890' y='235' font-size='14' text-anchor='middle'>Salary Distribution by Degree (Placed)</text>
  <image x='660' y='250' width='480' height='300' href='salary_by_degree_box.png' />

  <rect x='40' y='580' width='1120' height='180' class='tile' />
  <text x='600' y='600' font-size='14' text-anchor='middle'>Correlation Heatmap</text>
  <image x='80' y='620' width='1040' height='120' href='correlation_heatmap.png' />

</svg>
